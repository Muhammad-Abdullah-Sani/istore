<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile · I Store</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/profile.css">
    <script src="../js/app.js" defer></script>
</head>
<body class="loading" data-page="profile">
    <header class="nav">
        <div class="nav-inner">
            <a class="brand" href="dashboard.html">I Store</a>
            <nav class="nav-links">
                <a href="dashboard.html">Home</a>
                <a href="iphone.html">iPhone</a>
                <a href="macbook.html">MacBook</a>
                <a href="tablet.html">Tablets</a>
                <a href="earbuds.html">Earbuds</a>
                <a href="charger.html">Chargers</a>
                <a href="admin.html" class="admin-link" hidden>Admin</a>
            </nav>
            <div class="nav-user">
                <a href="profile.html" id="nav-name" class="active">Account</a>
                <a href="../../includes/logout.php" class="logout">Log out</a>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="profile-head">
            <div class="avatar" id="avatar"></div>
            <div>
                <h1 id="profile-name"></h1>
                <p><span id="profile-email"></span> &middot; Member since <span id="profile-since"></span></p>
            </div>
        </section>
        <div id="messages"></div>
        <div class="profile-grid">
            <form class="card" action="../../includes/profile.php" method="post">
                <h2>Update name</h2>
                <input type="hidden" name="action" value="name">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" maxlength="30" required>
                <button type="submit" class="btn">Save name</button>
            </form>
            <form class="card" action="../../includes/profile.php" method="post">
                <h2>Change password</h2>
                <input type="hidden" name="action" value="password">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" required>
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" minlength="8"
                       pattern="(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                       title="At least 8 characters, with a number and a special character" required>
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                <button type="submit" class="btn">Change password</button>
            </form>
        </div>
    </main>
    <div id="site-footer"></div>
</body>
</html>
