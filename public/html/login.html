<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · I Store</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/app.js" defer></script>
</head>
<body data-page="login">
    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">I Store</div>
            <h1>Log in</h1>
            <p class="auth-sub">Welcome back. Sign in to browse Apple products.</p>
            <div id="messages"></div>
            <form action="../../includes/login.php" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required autofocus>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>
                <button type="submit" class="btn btn-block">Log in</button>
            </form>
            <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
        </div>
    </main>
</body>
</html>
